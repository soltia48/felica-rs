[package]
name = "nfc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9"
cbc = "0.2"
cmac = "0.8"
des = "0.9"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
ofb = "0.7"
rand = "0.10"
rusb = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
thiserror = "2.0"

[dev-dependencies]
encoding_rs = "0.8"
