[package]
name = "nfc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
cbc = "0.1"
des = "0.8"
env_logger = "0.11.8"
hex = "0.4"
log = "0.4"
ofb = "0.6"
rand = "0.8"
rusb = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "1.0"

[dev-dependencies]
encoding_rs = "0.8"
