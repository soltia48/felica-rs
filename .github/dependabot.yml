version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # This crate carries cryptography and a USB stack; keeping its dependencies
  # current is part of keeping it trustworthy.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor:
        update-types: [minor, patch]
